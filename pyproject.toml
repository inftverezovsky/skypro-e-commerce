[tool.poetry]
name = "e-commerce"
version = "0.1.0"
description = "Учебное ядро интернет-магазина"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
pytest-cov = ">=5.0,<8.0"
flake8 = ">=7.0,<8.0"
isort = ">=5.13,<6.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.isort]
profile = "black"
line_length = 79
